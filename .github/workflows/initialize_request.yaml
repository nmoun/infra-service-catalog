name: Create request
on:
  workflow_dispatch:
    inputs:
      # TODO: replace tfvars_content by inputs used to generate the tfvars content
      tfvars_content:
        description: tfvars content (input provided for testing purpose, in real case, it is generated during the workflow execution)
        type: string
        required: true
      product_id:
        description: product id (input provided for testing purpose, in real case, product id is generated during the workflow execution)
        type: string
        required: true
      product_type:
        description: Product type (e.g vm_creation, gke_creation)
        type: string
        required: true
      environment:
        description: Github environment in the 'Provisioning' repository
        type: string
        required: true
      # TODO: might be linked to the product type provided
      repository:
        description: Repository containing the terraform configuration used
        type: string
        required: true
      repository_version:
        description: Version of the repository containing the terraform configuration (tag, sha...)
        type: string
        required: true

permissions:
  contents: read
  issues: write

jobs:
  # TODO: generation of tfvars content and product ID based on inputs should be executed before the request creation
  # generate_tfvars:

  # TODO: generate installation access tokens instead of using PATs
  create_request:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install PyGithub

      # TODO: check if tfvars content should be added too
      - name: Create request issue
        id: create
        env:
          TITLE: "[${{ inputs.product_type }}]: provisioning of ${{ inputs.product_id }}"
          INITIAL_DATA_JSON: >-
            {
              "product_id":"${{ inputs.product_id }}",
              "product_type":"${{ inputs.product_type }}",
              "environment": "${{ inputs.environment }}",
              "repository": "${{ inputs.repository }}",
              "repository_version": "${{ inputs.repository_version }}",
              "requested_by": "${{ github.actor }}"
            }
          REQUEST_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # EXTRA_LABELS_JSON: '["product:${{ inputs.product }}"]'
        run: python3 scripts/transition_guard.py create

      # Notes: we use event workflow_dispatch as repository_dispatch requires "Contents" repository permissions (write)
      - name: Call plan execution (workflow_dispatch)
        env:
          TFVARS_CONTENT: ${{ inputs.tfvars_content }}
        run: |
          printf '%s' "$TFVARS_CONTENT" > tfvars.txt

          jq -n \
            --arg product_id "${{ inputs.product_id }}" \
            --arg product_type "${{ inputs.product_type }}" \
            --arg tfvars "$(cat tfvars.txt)" \
            --arg environment "${{ inputs.environment }}" \
            --arg repository "${{ inputs.repository }}" \
            --arg repository_version "${{ inputs.repository_version }}" \
            --arg request_id "${{ steps.create.outputs.request_id }}" \
            --arg callback_repo "${{ github.repository }}" \
            '{
              ref: "main",
              inputs: {
                product_id: $product_id,
                product_type: $product_type,
                tfvars_content: $tfvars,
                environment: $environment,
                repository: $repository,
                repository_version: $repository_version,
                request_id: $request_id,
                callback_repo: $callback_repo,
                callback_workflow: "plan_callback.yaml"
              }
            }' | sed 's/\\\\n/\\n/g' > request_body.json

          echo 'request_body.json content:'
          cat request_body.json

          # TODO: use installation access token instead of PAT (must have Action (write) permission on called repo)
          # TODO: get repository based on product type (with a map for example)???
          HTTP_STATUS=$(curl -w "%{http_code}" -s -o response.json \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PAT }}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/repos/nmoun/workflows-cpa-build-on-gcp/actions/workflows/plan_dispatch.yaml/dispatches \
            -d @request_body.json)

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::GitHub API call failed with status $HTTP_STATUS"
            cat response.json
            exit 1
          fi
