name: Create request
on:
  workflow_dispatch:
    inputs:
      # TODO: replace tfvars_content by inputs used to generate the tfvars content
      tfvars_content:
        description: tfvars content (input provided for testing purpose, in real case, it is generated during the workflow execution)
        type: string
        required: true
      # TODO: in real case, product ID is produced during this workflow execution
      product_id:
        description: product id (input provided for testing purpose, in real case, product id is generated during the workflow execution)
        type: string
        required: true
      # TODO: in real case, not necessary as each product type has a dedicated workflow
      product_type:
        description: Product type (e.g vm_instance, gke_cluster...)
        type: string
        required: true
      # TODO: in real case, not necessary as product container is deduced from product type and inputs
      product_container:
        description: Product container (e.g my-project1, my-folder, my-org...)
        type: string
        required: true
      environment:
        description: Github environment in the 'Provisioning' repository
        type: string
        required: true
      # TODO: in real case, not necessary as each product type has a dedicated workflow.
      # provisioning_repository is specified in variables in the factory repository.
      provisioning_repository:
        type: string
        required: true
        description: Repository containing the pipelines to provision a specific product
      repository:
        type: string
        description: Repository containing the terraform template (override default if provided)
      repository_version:
        type: string
        description: Version of the repository to checkout (override default if provided)

permissions:
  contents: read
  id-token: write

env:
  TF_BACKEND_STATE: ${{ vars.tf_backend_state }}

jobs:
  # TODO: generation of tfvars content and product ID based on inputs should be executed before proceeding
  # generate_tfvars:

  # TODO: generate installation access tokens instead of using PATs
  create_request:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      # Authenticate to GCP
      - uses: 'google-github-actions/auth@v2'
        with:
          service_account: ${{ vars.wif_service_account_email }}
          workload_identity_provider: "projects/${{ vars.wif_project_nb }}/locations/global/workloadIdentityPools/${{ vars.wif_pool_name }}/providers/${{ vars.wif_provider_name }}"

      # TODO: generate backend prefix based on product container, product type and product ID
      - name: Generate backend prefix
        id: generate_backend_prefix
        run: |
          echo "backend_prefix=${{ inputs.product_container }}/${{ inputs.product_type }}/${{ inputs.product_id }}" >> $GITHUB_OUTPUT

      - name: Upload tfvars file
        env:
          TFVARS_CONTENT: ${{ inputs.tfvars_content }}
        run: |
          # TODO: use generated tfvars content based on inputs, instead of using provided tfvars_content
          echo $TFVARS_CONTENT | sed 's/\\"/"/g; s/\\n/\n/g' > terraform.tfvars
          # printf '%s' "$TFVARS_CONTENT" > terraform.tfvars

          # TODO: remove line below
          cat terraform.tfvars

          gcloud storage cp ./terraform.tfvars "gs://$TF_BACKEND_STATE/${{ steps.generate_backend_prefix.outputs.backend_prefix }}/terraform.tfvars"

      # Notes: we use event workflow_dispatch as repository_dispatch requires "Contents" repository permissions (write)
      - name: Call plan execution (workflow_dispatch)
        run: |
          jq -n \
            --arg backend_prefix "${{ steps.generate_backend_prefix.outputs.backend_prefix }}" \
            --arg environment "${{ inputs.environment }}" \
            --arg repository "${{ inputs.repository }}" \
            --arg repository_version "${{ inputs.repository_version }}" \
            --arg callback_repo "${{ github.repository }}" \
            '{
              ref: "main",
              inputs: {
                backend_prefix: $backend_prefix,
                environment: $environment,
                repository: $repository,
                repository_version: $repository_version,
                callback_repo: $callback_repo,
                callback_workflow: "plan_callback.yaml"
              }
            }' | sed 's/\\\\n/\\n/g' > request_body.json

          echo 'request_body.json content:'
          cat request_body.json

          # TODO: use installation access token instead of PAT (must have Action (write) permission on called repo)
          HTTP_STATUS=$(curl -w "%{http_code}" -s -o response.json \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PAT }}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/repos/${{ inputs.provisioning_repository }}/actions/workflows/plan_dispatch.yaml/dispatches \
            -d @request_body.json)

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::GitHub API call failed with status $HTTP_STATUS"
            cat response.json
            exit 1
          fi
