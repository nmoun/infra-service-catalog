name: Review plan for apply execution
on:
  workflow_dispatch:
    inputs:
      backend_prefix:
        description: Prefix in the object storage containing the backend state files
        type: string
        required: true
      status:
        description: Request status
        type: string
        required: true
      run_id:
        description: Run ID of the caller (concatenation of run_id and run_attempt)
        type: string
        required: true
      environment:
        description: Factory environment
        type: string
        required: true
      tf_plan_summary:
        description: TF plan summary
        type: string
      callback_repo:
        type: string
      callback_workflow:
        type: string

permissions:
  contents: read
  actions: write

jobs:
  plan_callback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Display the terraform summary within the workflow summary
        if: inputs.status == "PLAN_SUCCESS" && ${{ inputs.tf_plan_summary }}
        env:
          SUMMARY: ${{ inputs.tf_plan_summary }}
        run: |
          echo "$SUMMARY" >> $GITHUB_STEP_SUMMARY


  apply_execution:
    runs-on: ubuntu-latest
    needs: plan_callback
    # The environment attached to this job MUST require approval before the job can proceed.
    # TODO: determine whether the environment is hard coded at the service catalog level or if it should be provided somehow
    environment: manual-approval
    steps:
      - name: Create a workflow run for the terraform apply execution
        if: inputs.status == "PLAN_SUCCESS" && ${{ inputs.tf_plan_summary }}
        run: |
          echo "Triggering terraform apply workflow..."
          RUN_ID=$(echo "${{ inputs.run_id }}" | tr -d '[:space:]' | grep -oE '[0-9]+-[0-9]+$') || echo "::error::run_id format error."

          if [ -z "$RUN_ID" ]; then
            echo "::error::Expected format: '<digits>-<digits>' at end of line."
            exit 1
          fi

          cat <<-EOF > request_body.json
          {
            "ref":"main",
            "inputs":{
              "backend_prefix": "${{ inputs.backend_prefix }}",
              "plan_run_id":"${{ inputs.run_id }}",
              "environment": "${{ inputs.environment }}",
              "callback_repo": "${{ github.repository }}",
              "callback_workflow": "apply_callback.yaml"
            }
          }
          EOF

          echo 'request_body.json content:'
          cat request_body.json

          # TODO: use installation access token instead of PAT (must have Action (write) permission on called repo)
          HTTP_STATUS=$(curl -w "%{http_code}" -s -o response.json \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PAT }}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/repos/${{ inputs.callback_repo }}/actions/workflows/${{ inputs.callback_workflow }}/dispatches \
            -d @request_body.json)

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::GitHub API call failed with status $HTTP_STATUS"
            cat response.json
            exit 1
          fi
